<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuktiTagih — Bob Assistant</title>
    <style>
        :root {
            --bg: #edf5ff;
            --bg-strong: #dfeeff;
            --panel: rgba(255,255,255,0.88);
            --panel-strong: #ffffff;
            --line: rgba(88, 126, 255, 0.18);
            --line-strong: rgba(44, 97, 255, 0.3);
            --text: #11213d;
            --text-soft: #59709a;
            --blue-1: #1d4ed8;
            --blue-2: #2563eb;
            --blue-3: #60a5fa;
            --blue-4: #dbeafe;
            --success: #1b9c6d;
            --success-soft: #ebfff7;
            --error: #d62839;
            --error-soft: #fff1f3;
            --shadow: 0 20px 50px rgba(30, 72, 172, 0.12);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
            font-size: 15px;
            line-height: 1.6;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(96, 165, 250, 0.35), transparent 28%),
                radial-gradient(circle at right, rgba(37, 99, 235, 0.18), transparent 30%),
                linear-gradient(180deg, #f2f8ff 0%, #edf4ff 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        nav {
            background: rgba(255,255,255,0.72);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--line);
            box-shadow: 0 1px 0 rgba(18, 47, 103, 0.04);
            padding: 0 24px;
            height: 62px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .brand { font-weight: 800; font-size: 1.08rem; color: var(--text); letter-spacing: -0.04em; }
        .brand span { color: var(--blue-2); }
        .nav-right { display: flex; align-items: center; gap: 12px; }
        .nav-label { font-size: 0.8rem; color: var(--text-soft); }

        .btn-back {
            font-size: 0.8rem;
            color: var(--text-soft);
            text-decoration: none;
            border: 1px solid var(--line);
            padding: 7px 12px;
            border-radius: 10px;
            background: rgba(255,255,255,0.72);
            transition: 0.15s ease;
        }
        .btn-back:hover {
            background: rgba(219,234,254,0.7);
            color: var(--text);
        }

        .context-strip {
            background: rgba(219,234,254,0.8);
            border-bottom: 1px solid rgba(59,130,246,0.2);
            padding: 8px 24px;
            font-size: 0.8rem;
            color: #1d4ed8;
            display: none;
            flex-shrink: 0;
        }
        .context-strip.show { display: block; }
        .context-strip strong { font-weight: 700; }

        .chat-wrapper {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-width: 760px;
            width: 100%;
            margin: 0 auto;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .msg-row { display: flex; flex-direction: column; }
        .msg-row.user { align-items: flex-end; }
        .msg-row.bob  { align-items: flex-start; }

        .msg-label {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 5px;
            color: var(--text-soft);
        }

        .bubble {
            max-width: 72%;
            padding: 12px 14px;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-word;
            box-shadow: 0 10px 24px rgba(59, 130, 246, 0.06);
        }

        .bubble.bob-bubble {
            background: rgba(255,255,255,0.7);
            border: 1px solid var(--line);
            border-bottom-left-radius: 4px;
            color: var(--text);
        }

        .bubble.user-bubble {
            background: linear-gradient(135deg, var(--blue-2), var(--blue-1));
            color: #fff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 14px 28px rgba(37, 99, 235, 0.22);
        }

        .bubble.system-bubble {
            background: var(--success-soft);
            border: 1px solid rgba(27, 156, 109, 0.18);
            color: #0f5d43;
            font-size: 0.8rem;
            align-self: center;
            border-radius: 20px;
            padding: 6px 14px;
            max-width: 90%;
            text-align: center;
        }

        .typing-dots span {
            display: inline-block;
            width: 7px; height: 7px;
            background: var(--text-soft);
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.2s infinite;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-5px); }
        }

        .input-area {
            background: rgba(255,255,255,0.72);
            border-top: 1px solid var(--line);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 14px 16px;
            flex-shrink: 0;
            max-width: 760px;
            width: 100%;
            margin: 0 auto;
        }

        .quick-replies {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }

        .qr-btn {
            background: rgba(255,255,255,0.7);
            border: 1px solid var(--line);
            color: var(--text);
            border-radius: 999px;
            padding: 5px 12px;
            font-size: 0.78rem;
            cursor: pointer;
            transition: 0.15s ease;
        }
        .qr-btn:hover {
            background: rgba(219,234,254,0.7);
            border-color: rgba(59,130,246,0.28);
        }

        .input-row { display: flex; gap: 8px; align-items: flex-end; }
        textarea {
            flex: 1;
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 10px 12px;
            font-family: inherit;
            font-size: 0.9rem;
            color: var(--text);
            resize: none;
            background: rgba(255,255,255,0.72);
            line-height: 1.5;
        }
        textarea:focus {
            outline: none;
            border-color: rgba(37, 99, 235, 0.5);
            background: rgba(255,255,255,0.9);
            box-shadow: 0 0 0 3px rgba(96,165,250,0.18);
        }
        textarea::placeholder { color: #8aa0c1; }

        .btn-send {
            background: linear-gradient(135deg, var(--blue-2), var(--blue-1));
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 10px 18px;
            font-size: 0.875rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.15s ease;
            box-shadow: 0 12px 22px rgba(37, 99, 235, 0.18);
        }
        .btn-send:hover:not(:disabled) { filter: brightness(1.02); }
        .btn-send:disabled { background: linear-gradient(135deg, #cfe1ff, #bfd5ff); color: rgba(17,33,61,0.55); cursor: not-allowed; box-shadow: none; }

        .input-hint { font-size: 0.72rem; color: var(--text-soft); margin-top: 6px; }
    </style>
</head>
<body>

<nav>
    <span class="brand">Bukti<span>Tagih</span></span>
    <div class="nav-right">
        <span class="nav-label">Bob — Asisten Analisis</span>
        <a id="backToResult" href="upload.html" class="btn-back">← Kembali</a>
    </div>
</nav>

<div class="context-strip" id="contextStrip">
    Konteks aktif: Analysis <strong id="ctxAnalysisId">—</strong>
    &nbsp;·&nbsp; Kamu sedang mendiskusikan hasil analisis ini bersama Bob.
</div>

<div class="chat-wrapper">
    <div class="messages" id="messages"></div>

    <div class="input-area">
        <div class="quick-replies" id="quickReplies">
            <button class="qr-btn" data-msg="Apa itu kategori HARASSMENT?">Apa itu HARASSMENT?</button>
            <button class="qr-btn" data-msg="Apa langkah selanjutnya yang harus saya lakukan?">Langkah selanjutnya?</button>
            <button class="qr-btn" data-msg="Bagaimana cara melaporkan ke OJK?">Cara lapor ke OJK?</button>
            <button class="qr-btn" data-msg="Apa itu DATA_EXPOSURE?">Apa itu DATA_EXPOSURE?</button>
            <button class="qr-btn" data-msg="Regulasi apa yang dilanggar?">Regulasi yang dilanggar?</button>
        </div>
        <div class="input-row">
            <textarea id="chatInput" rows="2"
                placeholder="Tanyakan tentang hasil analisis atau situasimu…"
                maxlength="1000"></textarea>
            <button class="btn-send" id="sendBtn">Kirim</button>
        </div>
        <div class="input-hint">Bob adalah asisten AI — bukan pengganti nasihat hukum profesional.</div>
    </div>
</div>

<script>
const API_BASE   = 'http://127.0.0.1:8000/api';
const params     = new URLSearchParams(window.location.search);
const analysisId = params.get('analysis_id');

const messagesEl   = document.getElementById('messages');
const chatInput    = document.getElementById('chatInput');
const sendBtn      = document.getElementById('sendBtn');
const contextStrip = document.getElementById('contextStrip');
const ctxId        = document.getElementById('ctxAnalysisId');
const backBtn      = document.getElementById('backToResult');
const quickReplies = document.getElementById('quickReplies');

let analysisContext = null;

if (analysisId) {
    ctxId.textContent = analysisId;
    contextStrip.classList.add('show');
    backBtn.href = `result.html?analysis_id=${analysisId}`;
}

// ─── Knowledge base Bob ──────────────────────────────────────────────────
// Nanti digantikan dengan panggilan ke Langflow + Gemini API.
const BOB_KB = {
    HARASSMENT: `Kategori **Intimidasi (HARASSMENT)** berarti bukti kamu mengandung perilaku intimidatif dari pihak penagih — misalnya ancaman verbal, bahasa kasar berulang, atau tekanan psikologis yang berlebihan.\n\nIni melanggar:\n• POJK No. 22/POJK.07/2020 — Perlindungan Konsumen Sektor Jasa Keuangan\n• AFPI Code of Conduct — larangan penagihan yang merendahkan martabat`,
    THREAT:     `Kategori **Ancaman (THREAT)** berarti terdapat ancaman nyata dalam bukti kamu — misalnya ancaman penyebaran data, ancaman fisik, atau ancaman hukum yang tidak berdasar.\n\nIni melanggar:\n• KUHP Pasal 335 — perbuatan tidak menyenangkan / ancaman\n• UU ITE Pasal 29 — ancaman kekerasan melalui media elektronik\n• POJK No. 22/POJK.07/2020`,
    DATA_EXPOSURE: `Kategori **Kebocoran Data (DATA_EXPOSURE)** berarti pihak penagih mengancam atau melakukan penyebaran data pribadimu — seperti KTP, foto, nomor telepon keluarga, atau informasi sensitif lainnya.\n\nIni melanggar:\n• UU No. 27 Tahun 2022 tentang Perlindungan Data Pribadi (UU PDP)\n• POJK No. 1/POJK.07/2013 — kerahasiaan data konsumen`,
    SPAM:       `Kategori **Spam** berarti terdapat pengiriman pesan berulang secara masif yang melampaui batas wajar — misalnya ratusan pesan dalam sehari atau penagihan ke kontak di luar daftar yang kamu berikan.\n\nIni melanggar:\n• AFPI Code of Conduct — penagihan hanya boleh dilakukan pada jam tertentu\n• POJK tentang pembatasan frekuensi kontak penagihan`,
    NORMAL:     `Kategori **Normal** berarti sistem tidak menemukan indikasi pelanggaran dalam bukti yang kamu upload.\n\nJika kamu merasa ada yang tidak beres, coba upload bukti lain yang lebih spesifik, atau ceritakan situasimu lebih detail.`,
    ojk:        `Cara melaporkan ke OJK:\n\n1. Kunjungi **ojk.go.id** atau aplikasi Appek OJK\n2. Pilih menu "Pengaduan"\n3. Siapkan: KTP, bukti penagihan, laporan PDF dari BuktiTagih\n4. Isi form pengaduan dengan kronologi kejadian\n5. OJK akan menindaklanjuti dalam 20 hari kerja\n\nBisa juga hubungi hotline OJK: 157`,
    afpi:       `AFPI (Asosiasi Fintech Pendanaan Bersama Indonesia) menerima pengaduan terkait anggotanya:\n\n1. Website: afpi.or.id\n2. Email: pengaduan@afpi.or.id\n3. Sertakan laporan PDF dari BuktiTagih sebagai bukti pendukung`,
    next_steps: `Langkah yang disarankan setelah menerima hasil analisis:\n\n1. Download laporan PDF dari halaman hasil\n2. Simpan semua bukti asli (screenshot, rekaman)\n3. Laporkan ke OJK melalui ojk.go.id atau hubungi 157\n4. Laporkan ke AFPI jika pinjolnya terdaftar AFPI\n5. Konsultasi ke LBH (Lembaga Bantuan Hukum) terdekat jika kasus serius\n6. Blokir nomor penagih setelah semua bukti sudah dikumpulkan`,
    default:    `Saya Bob, asisten analisis BuktiTagih.\n\nSaya bisa membantu kamu memahami:\n• Hasil klasifikasi AI (Intimidasi, Ancaman, Kebocoran Data, Spam)\n• Regulasi yang dilanggar\n• Langkah tindak lanjut ke OJK atau AFPI\n• Cara menggunakan laporan PDF\n\nCoba gunakan tombol cepat di bawah, atau tanyakan langsung.`
};

function getBobReply(msg) {
    const m = msg.toLowerCase();
    if (m.includes('harassment') || m.includes('intimidasi')) return BOB_KB.HARASSMENT;
    if (m.includes('threat') || m.includes('ancaman'))        return BOB_KB.THREAT;
    if (m.includes('data_exposure') || m.includes('data exposure') || m.includes('kebocoran')) return BOB_KB.DATA_EXPOSURE;
    if (m.includes('spam'))                                    return BOB_KB.SPAM;
    if (m.includes('normal') && m.includes('kategori'))        return BOB_KB.NORMAL;
    if (m.includes('ojk') || m.includes('lapor') || m.includes('pengaduan')) return BOB_KB.ojk;
    if (m.includes('afpi'))                                    return BOB_KB.afpi;
    if (m.includes('selanjutnya') || m.includes('langkah') || m.includes('harus')) return BOB_KB.next_steps;
    if (m.includes('regulasi') || m.includes('aturan') || m.includes('pasal') || m.includes('dilanggar')) {
        if (analysisContext?.category && BOB_KB[analysisContext.category]) return BOB_KB[analysisContext.category];
        return 'Untuk melihat regulasi yang relevan, lihat detail di halaman hasil analisis. Atau tanyakan kategori spesifik, misal "regulasi HARASSMENT".';
    }
    if (analysisContext && (m.includes('hasil') || m.includes('analisis') || m.includes('maksud'))) {
        const cat = analysisContext.category;
        if (BOB_KB[cat]) return `Berdasarkan hasil analisis bukti kamu (kategori: **${cat}**):\n\n${BOB_KB[cat]}`;
    }
    return BOB_KB.default;
}

// ─── Render helpers ──────────────────────────────────────────────────────
function addMessage(role, text) {
    const row = document.createElement('div');
    row.className = `msg-row ${role === 'user' ? 'user' : role === 'system' ? '' : 'bob'}`;

    if (role === 'system') {
        row.innerHTML = `<div class="bubble system-bubble">${text}</div>`;
    } else {
        const labelText = role === 'bob' ? 'Bob' : 'Kamu';
        const bubbleCls = role === 'bob' ? 'bob-bubble' : 'user-bubble';
        const formatted = text
            .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
            .replace(/\n/g, '<br>');
        row.innerHTML = `
            <div class="msg-label">${labelText}</div>
            <div class="bubble ${bubbleCls}">${formatted}</div>`;
    }

    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return row;
}

function addTyping() {
    const row = document.createElement('div');
    row.id = 'typing';
    row.className = 'msg-row bob';
    row.innerHTML = `
        <div class="msg-label">Bob</div>
        <div class="bubble bob-bubble typing-dots">
            <span></span><span></span><span></span>
        </div>`;
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
}
function removeTyping() { document.getElementById('typing')?.remove(); }

// ─── Send ────────────────────────────────────────────────────────────────
async function sendMessage(text) {
    const msg = text.trim();
    if (!msg) return;

    chatInput.value = '';
    sendBtn.disabled = true;
    quickReplies.style.display = 'none';

    addMessage('user', msg);
    addTyping();

    await new Promise(r => setTimeout(r, 600 + Math.random() * 500));

    removeTyping();
    addMessage('bob', getBobReply(msg));
    sendBtn.disabled = false;
    chatInput.focus();
}

sendBtn.addEventListener('click', () => sendMessage(chatInput.value));
chatInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(chatInput.value); }
});
quickReplies.querySelectorAll('.qr-btn').forEach(btn => {
    btn.addEventListener('click', () => sendMessage(btn.dataset.msg));
});

// ─── Init ────────────────────────────────────────────────────────────────
async function init() {
    let welcome = `Halo! Saya **Bob**, asisten analisis BuktiTagih.\n\nSaya di sini untuk membantu kamu memahami hasil analisis dan menjelaskan langkah selanjutnya yang bisa kamu ambil.`;

    if (analysisId) {
        try {
            const res = await fetch(`${API_BASE}/analysis/${analysisId}`, {
                headers: { 'Accept': 'application/json' }
            });
            if (res.ok) {
                analysisContext = await res.json();
                const cat = analysisContext.category;
                if (cat && cat !== 'PENDING') {
                    welcome += `\n\nSaya sudah membaca hasil analisis: bukti diidentifikasi sebagai **${cat}**. Mau saya jelaskan lebih lanjut?`;
                } else {
                    welcome += `\n\nHasil analisis masih diproses. Kamu tetap bisa bertanya seputar kategori pelanggaran atau langkah tindak lanjut.`;
                }
            }
        } catch (_) {}
    } else {
        welcome += `\n\nKamu bisa tanya tentang kategori pelanggaran, regulasi yang berlaku, atau cara melaporkan ke OJK dan AFPI.`;
    }

    addMessage('bob', welcome);
}

init();
</script>
</body>
</html>
