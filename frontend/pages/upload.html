<!DOCTYPE html>
<html lang="id" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuktiTagih AI - Upload</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
    <div class="container mt-5">
        <h2 class="mb-4">Unggah Bukti Penagihan</h2>
        <div class="card bg-secondary text-white">
            <div class="card-body">
                <form id="uploadForm">
                    <div class="mb-3">
                        <label for="evidenceFile" class="form-label">Pilih File (Screenshot/PDF)</label>
                        <input class="form-control bg-dark text-light" type="file" id="evidenceFile" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Proses Bukti</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
